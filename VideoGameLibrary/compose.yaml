services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: videogame-frontend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - BackendUrl=http://backend:8081
    depends_on:
      - backend


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: videogame-backend
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=VideoGameLibrary;Username=postgres;Password=Russell1!
    depends_on:
      - database


  database:
    build:
      context: .
      dockerfile: Dockerfile.database
    container_name: videogame-database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=VideoGameLibrary
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Russell1!
    volumes:
      - postgres_data:/var/lib/postgresql


volumes:
  postgres_data: